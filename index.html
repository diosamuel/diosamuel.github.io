<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#1e3a8a">
	<link rel="manifest" href="./manifest.webmanifest">
	<link rel="icon" type="image/svg+xml" href="./icon.svg">
	<link rel="apple-touch-icon" href="./bg.png">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="/diosamuel">
	<title>/diosamuel</title>
	<style type="text/css">
		body{
			background: url('./bg.png');
  			/* Full height */
  			height: 100%;
  			/* Center and scale the image nicely */
  			background-position: center;
  			background-repeat: no-repeat;
  			background-size: cover;
		}
		#a2hs {
			position: fixed;
			bottom: 16px;
			right: 16px;
			z-index: 9999;
			padding: 10px 16px;
			border: none;
			border-radius: 999px;
			background: #1e3a8a;
			color: #fff;
			font: 600 14px/1 ui-monospace, Menlo, Consolas, monospace;
			cursor: pointer;
			box-shadow: 0 4px 14px rgba(0,0,0,.35);
		}
		#a2hs:hover { background: #0ea5e9; }
	</style>
</head>
<body>
	<button id="a2hs" hidden>+ Add to Home Screen</button>
</body>
</html>
